name: Build and Release Silex Binary

on:
  push:
    tags:
      - "v*" # Trigger on version tags e.g. v2.0.0

jobs:
  build:
    name: Build Silex Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: silex-linux
            binary_name: silex
          - os: macos-latest
            artifact_name: silex-macos
            binary_name: silex
          - os: windows-latest
            artifact_name: silex-windows
            binary_name: silex.exe

    steps:
      - name: Checkout Private Silex Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Compile Standalone Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name ${{ matrix.binary_name }} --clean --log-level INFO src/silex/server/daemon.py

      - name: Verify Binary Exists
        shell: bash
        run: |
          if [ ! -f "dist/${{ matrix.binary_name }}" ]; then
            echo "PyInstaller failed to output dist/${{ matrix.binary_name }}"
            exit 1
          fi

      - name: Rename Artifact for OS
        shell: bash
        run: |
          mv "dist/${{ matrix.binary_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload Binary to Public VYN Repository Release
        uses: softprops/action-gh-release@v2
        with:
          repository: openyfai/VYN
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          files: dist/${{ matrix.artifact_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
