[project]
name = "openyfai-silex-engine"
version = "2.0.0"
description = "The Causal Memory and Cognitive Engine for VYN."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.4.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "fastapi>=0.100.0",
    "google-genai>=0.3.0",
    "openai>=1.0.0",
    "anthropic>=0.19.0",
    "python-dotenv>=1.0",
    "watchdog>=4.0",
    "playwright>=1.45",
    "html2text>=2024.2.26",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aria*"]

[tool.setuptools.package-data]
"silex.web_dist" = ["**/*"]

