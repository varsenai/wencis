[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wencis"
version = "0.1.0"
description = "Epistemic reasoning engine for AI agents — causal debugging, trajectory optimization, and self-improvement"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "debugging", "causal-reasoning", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiosqlite>=0.20.0",   # Async SQLite (default storage backend)
    "pydantic>=2.0.0",     # Schema validation for LLM structured output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]",
]

[project.urls]
Homepage = "https://github.com/varsenai/wencis"
Repository = "https://github.com/varsenai/wencis"
Issues = "https://github.com/varsenai/wencis/issues"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
