<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" height="100%">
  <defs>
    <!-- Neon Violet to Pink Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Neon Teal Gradient -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>

    <!-- Dead-end Red Gradient -->
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ba0000"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glowViolet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTeal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .wencis-title {
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 8px;
      fill: #111111;
    }
    @media (prefers-color-scheme: dark) {
      .wencis-title {
        fill: #ffffff;
      }
    }
  </style>

  <!-- Connective Edges (Traces) -->
  <!-- Decision -> Hypothesis -->
  <path d="M 100 130 C 160 80, 220 80, 280 130" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Hypothesis -> Fact -->
  <path d="M 280 130 C 340 180, 400 180, 460 130" fill="none" stroke="url(#secondaryGrad)" stroke-width="4" filter="url(#glowTeal)"/>
  
  <!-- Decision -> Dead End -->
  <path d="M 100 130 C 200 200, 300 200, 380 160" fill="none" stroke="url(#dangerGrad)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Graph Nodes -->
  
  <!-- Node 1: Decision (Source Node) -->
  <g transform="translate(100,130)">
    <circle r="25" fill="#000000" fill-opacity="0.05" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glowViolet)"/>
    <circle r="10" fill="url(#primaryGrad)"/>
  </g>
  
  <!-- Node 2: Hypothesis -->
  <g transform="translate(280,130)">
    <polygon points="0,-24 20,-12 20,12 0,24 -20,12 -20,-12" fill="#000000" fill-opacity="0.05" stroke="url(#secondaryGrad)" stroke-width="3" filter="url(#glowTeal)"/>
    <polygon points="0,-10 8,-5 8,5 0,10 -8,5 -8,-5" fill="url(#secondaryGrad)"/>
  </g>
  
  <!-- Node 3: Fact (Terminal Success) -->
  <g transform="translate(460,130)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#000000" fill-opacity="0.05" stroke="url(#secondaryGrad)" stroke-width="3" filter="url(#glowTeal)"/>
    <path d="M -8 0 L -2 6 L 8 -5" fill="none" stroke="url(#secondaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Node 4: Dead_End (Terminal Failure) -->
  <g transform="translate(380,160)">
    <circle r="16" fill="#000000" fill-opacity="0.05" stroke="url(#dangerGrad)" stroke-width="2" filter="url(#glowRed)"/>
    <path d="M -5 -5 L 5 5 M 5 -5 L -5 5" fill="none" stroke="url(#dangerGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Sleek Typography -->
  <text x="288" y="240" class="wencis-title" text-anchor="middle">
    WENCIS
  </text>
</svg>
