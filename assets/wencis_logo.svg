<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <style>
    .brand-color {
      fill: #4f46e5;
    }
    .brand-edge {
      stroke: #4f46e5;
      stroke-width: 4;
      stroke-opacity: 0.4;
    }
    .brand-text {
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      .brand-color {
        fill: #818cf8;
      }
      .brand-edge {
        stroke: #818cf8;
      }
      .brand-text {
        fill: #818cf8;
      }
    }
  </style>

  <!-- Left: Minimalist Graph Icon -->
  <g transform="translate(10, 10)">
    <!-- Edges -->
    <line x1="20" y1="30" x2="50" y2="15" class="brand-edge"/>
    <line x1="20" y1="30" x2="50" y2="45" class="brand-edge"/>
    <line x1="50" y1="15" x2="80" y2="30" class="brand-edge"/>
    <line x1="50" y1="45" x2="80" y2="30" class="brand-edge"/>
    <line x1="50" y1="15" x2="50" y2="45" class="brand-edge"/>

    <!-- Nodes -->
    <circle cx="20" cy="30" r="7" class="brand-color"/>
    <circle cx="50" cy="15" r="7" class="brand-color"/>
    <circle cx="50" cy="45" r="7" class="brand-color"/>
    <!-- Target node representing Decision/Outcome -->
    <circle cx="80" cy="30" r="11" class="brand-color"/>
  </g>

  <!-- Right: Logo Text "wencis" -->
  <text x="115" y="56" class="brand-text">wencis</text>
</svg>
