<svg id="wencis-svg-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" class="w-full h-full select-none">
                        <defs>
                            <!-- Linear Gradients -->
                            <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f0ff"></stop>
                                <stop offset="100%" stop-color="#0066ff"></stop>
                            </linearGradient>
                            <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#a855f7"></stop>
                                <stop offset="100%" stop-color="#ec4899"></stop>
                            </linearGradient>
                            <linearGradient id="neon-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"></stop>
                                <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"></stop>
                                <stop offset="100%" stop-color="#070b12" stop-opacity="0"></stop>
                            </linearGradient>
                            <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#10b981"></stop>
                                <stop offset="100%" stop-color="#059669"></stop>
                            </linearGradient>

                            <!-- Radial Gradients for holographic nodes -->
                            <radialGradient id="radial-core" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"></stop>
                                <stop offset="30%" stop-color="#00a2ff" stop-opacity="0.7"></stop>
                                <stop offset="70%" stop-color="#0a122c" stop-opacity="0.3"></stop>
                                <stop offset="100%" stop-color="#070b12" stop-opacity="0"></stop>
                            </radialGradient>

                            <!-- Cyber Grid Pattern -->
                            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d44" stroke-width="0.7" stroke-opacity="0.5"></path>
                                <circle cx="40" cy="40" r="1.5" fill="#1f2d44" fill-opacity="0.8"></circle>
                            </pattern>

                            <!-- Glow Filters -->
                            <filter id="svg-glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
                                <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                            </filter>
                        </defs>

                        <!-- Cyber grid background -->
                        <rect width="100%" height="100%" fill="url(#grid)"></rect>
                        
                        <!-- Ambient backlights -->
                        <circle cx="400" cy="300" r="280" fill="url(#radial-core)" opacity="0.3" class="animate-pulse-slow"></circle>
                        <circle cx="200" cy="200" r="150" fill="url(#radial-core)" opacity="0.1"></circle>

                        <!-- MAIN CENTRAL CORE (The Flight Recorder & Brain) -->
                        <g id="core-mesh" class="transition-opacity duration-300" style="opacity: 1;">
                            <!-- Telemetry boundary circle -->
                            <circle cx="400" cy="300" r="220" fill="none" stroke="#1f2d44" stroke-width="1.5" stroke-dasharray="4, 12"></circle>
                            
                            <!-- Rotating telemetry rings -->
                            <g class="animate-spin-cw">
                                <circle cx="400" cy="300" r="180" fill="none" stroke="url(#cyan-blue)" stroke-width="2" stroke-dasharray="80 120" opacity="0.4"></circle>
                                <circle cx="400" cy="300" r="160" fill="none" stroke="url(#purple-pink)" stroke-width="1.5" stroke-dasharray="40 180" opacity="0.6"></circle>
                                <path d="M 230 300 A 170 170 0 0 1 570 300" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="5, 35"></path>
                            </g>
                            
                            <g class="animate-spin-ccw">
                                <circle cx="400" cy="300" r="140" fill="none" stroke="url(#cyan-blue)" stroke-width="1.5" stroke-dasharray="200, 30" opacity="0.3"></circle>
                                <circle cx="400" cy="300" r="120" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="10 90" opacity="0.5"></circle>
                                <circle cx="400" cy="300" r="100" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="120 120" opacity="0.4"></circle>
                            </g>

                            <!-- Inner Holographic core (The Black Box Engine) -->
                            <g id="flight-recorder-capsule" style="transform: scale(1);">
                                <rect x="360" y="260" width="80" height="80" rx="18" fill="#090d16" stroke="url(#cyan-blue)" stroke-width="3" filter="url(#svg-glow)" class="neon-glow-cyan"></rect>
                                <!-- Concentric circuit inside the black box -->
                                <circle cx="400" cy="300" r="28" fill="none" stroke="url(#purple-pink)" stroke-width="1"></circle>
                                <circle cx="400" cy="300" r="18" fill="url(#cyan-blue)" opacity="0.8" class="animate-pulse">
                                    <animate attributeName="r" values="10;20;10" dur="3s" repeatCount="indefinite"></animate>
                                </circle>
                                <circle cx="400" cy="300" r="6" fill="#ffffff"></circle>
                            </g>
                        </g>

                        <!-- COGNITIVE AGENT PATHS (Recordings of actions/steps) -->
                        <g id="grid-paths" class="transition-opacity duration-300" style="opacity: 1;">
                            <!-- Background Static Node Connectors -->
                            <path d="M 120 150 L 250 180 L 400 300 L 580 200 L 680 320" fill="none" stroke="#1f2d44" stroke-width="1.5"></path>
                            <path d="M 180 450 L 300 400 L 400 300 L 500 480 L 680 420" fill="none" stroke="#1f2d44" stroke-width="1.5"></path>
                            
                            <!-- Trace Flow Path (Recorder Line tracking the thought sequence) -->
                            <!-- Primary Cognition Stream -->
                            <path id="agent-flight-path" d="M 120 150 Q 220 220, 290 190 T 400 300 T 510 410 T 680 420" fill="none" stroke="url(#cyan-blue)" stroke-width="3" class="agent-flow-line" filter="url(#svg-glow)" style="animation-duration: 1.38s;"></path>
                            
                            <!-- Self-Improvement Optimizer Loop (Tightens deviations) -->
                            <path id="optimization-loop" d="M 680 420 C 650 250, 500 150, 400 300 C 300 450, 150 350, 120 150" fill="none" stroke="url(#purple-pink)" stroke-width="2" class="agent-flow-line-reverse" opacity="0.6" stroke-dasharray="10, 15" style="animation-duration: 1.38s; stroke: url(&quot;#purple-pink&quot;);"></path>

                            <!-- Dynamic Glowing Pulse traversing the path -->
                            <circle r="6" fill="#ffffff" filter="url(#svg-glow)" class="neon-glow-cyan">
                                <animateMotion dur="4s" repeatCount="indefinite" path="M 120 150 Q 220 220, 290 190 T 400 300 T 510 410 T 680 420"></animateMotion>
                            </circle>

                            <!-- Optimizing Feedback Pulse -->
                            <circle r="5" fill="#10b981" filter="url(#svg-glow)" class="neon-glow-green">
                                <animateMotion dur="3s" repeatCount="indefinite" path="M 680 420 C 650 250, 500 150, 400 300 C 300 450, 150 350, 120 150"></animateMotion>
                            </circle>

                            <!-- Nodes of Decisions (Actions, Prompts, Reasonings) -->
                            <!-- Node 1: Action Entry -->
                            <g transform="translate(120, 150)" class="cursor-pointer group/node" onclick="triggerNodeLog('Initial Thought Prompt')">
                                <circle r="16" fill="#080c14" stroke="url(#cyan-blue)" stroke-width="2"></circle>
                                <circle r="6" fill="#00f0ff" class="animate-pulse"></circle>
                                <text y="-24" font-family="JetBrains Mono" font-size="10" fill="#a8a29e" text-anchor="middle">REASON_START</text>
                            </g>

                            <!-- Node 2: Tool Call -->
                            <g transform="translate(290, 190)" class="cursor-pointer group/node" onclick="triggerNodeLog('Tool Invocation (Search API)')">
                                <circle r="14" fill="#080c14" stroke="url(#cyan-blue)" stroke-width="2"></circle>
                                <polygon points="0,-6 6,4 -6,4" fill="#00f0ff"></polygon>
                                <text y="-22" font-family="JetBrains Mono" font-size="10" fill="#a8a29e" text-anchor="middle">TOOL_CALL</text>
                            </g>

                            <!-- Node 3: Center Flight Rec / Evaluation -->
                            <g transform="translate(400, 300)">
                                <!-- Center is visual focus - overlaid by Capsule -->
                            </g>

                            <!-- Node 4: Self Correction / Verification -->
                            <g transform="translate(510, 410)" class="cursor-pointer group/node" onclick="triggerNodeLog('Self-Correction Step')">
                                <circle r="14" fill="#080c14" stroke="url(#purple-pink)" stroke-width="2"></circle>
                                <rect x="-5" y="-5" width="10" height="10" fill="#a855f7"></rect>
                                <text y="24" font-family="JetBrains Mono" font-size="10" fill="#a8a29e" text-anchor="middle">OPTIMIZE_CORRECTION</text>
                            </g>

                            <!-- Node 5: Output Execution -->
                            <g transform="translate(680, 420)" class="cursor-pointer group/node" onclick="triggerNodeLog('Terminal Output Finalized')">
                                <circle r="16" fill="#080c14" stroke="url(#green-grad)" stroke-width="2.5"></circle>
                                <path d="M -5 -1 L -1 3 L 5 -4" fill="none" stroke="#10b981" stroke-width="2.5"></path>
                                <text y="-24" font-family="JetBrains Mono" font-size="10" fill="#a8a29e" text-anchor="middle">GOAL_ALIGNMENT</text>
                            </g>
                        </g>

                        <!-- HUD DIAGNOSTICS OVERLAYS -->
                        <g id="hud-text" class="transition-opacity duration-300" font-family="JetBrains Mono" style="opacity: 0;">
                            <!-- Top Left Status Panel -->
                            <g transform="translate(40, 50)">
                                <rect width="180" height="56" rx="6" fill="#0f1624" fill-opacity="0.8" stroke="#1f2d44" stroke-width="1"></rect>
                                <text x="12" y="20" font-size="10" fill="#94a3b8">WENCIS COGNITIVE PROBE</text>
                                <text x="12" y="35" font-size="11" fill="#00f0ff" font-weight="bold">REC_STATE: ARMED</text>
                                <text x="12" y="48" font-size="9" fill="#10b981">LATENCY: 14ms</text>
                                <circle cx="160" cy="32" r="4" fill="#10b981" class="animate-pulse"></circle>
                            </g>

                            <!-- Bottom Left Data Logs inside Art -->
                            <g transform="translate(40, 490)">
                                <rect width="210" height="70" rx="6" fill="#0f1624" fill-opacity="0.8" stroke="#1f2d44" stroke-width="1"></rect>
                                <text x="12" y="18" font-size="9" fill="#00f0ff">&gt; COGNITIVE TRACE LOGS</text>
                                <text id="hud-log-1" x="12" y="34" font-size="10" fill="#e2e8f0">&gt; Recorder processed trace</text>
                                <text id="hud-log-2" x="12" y="48" font-size="10" fill="#94a3b8">&gt; Divergence check: 0.04%</text>
                                <text id="hud-log-3" x="12" y="60" font-size="10" fill="#10b981">&gt; Safe behavior confirmed</text>
                            </g>

                            <!-- Bottom Right Telemetry Specs -->
                            <g transform="translate(540, 50)">
                                <rect width="220" height="70" rx="6" fill="#0f1624" fill-opacity="0.8" stroke="#1f2d44" stroke-width="1"></rect>
                                <text x="12" y="18" font-size="9" fill="#94a3b8">SELF-IMPROVEMENT ENGINE</text>
                                <text x="12" y="34" font-size="11" fill="#ffffff" font-weight="bold">SYNAPSE BIAS CHECK</text>
                                <text x="12" y="48" font-size="10" fill="#a855f7">DIVERGENCE DRIFT: 0.012%</text>
                                <text id="hud-opt-level" x="12" y="61" font-size="10" fill="#10b981">OPTIMIZATION STAGE: MAX</text>
                            </g>

                            <!-- Corner Grid coordinates for a cool blueprint look -->
                            <text x="770" y="580" font-size="10" fill="#1f2d44" text-anchor="end">WNC-800x600</text>
                            <text x="30" y="580" font-size="10" fill="#1f2d44">REC-CH.4</text>
                        </g>
                    </svg>
