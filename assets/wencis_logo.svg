<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="100%" stop-color="#0c0c1e"/>
    </linearGradient>
    
    <!-- Neon Violet to Pink Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Neon Teal Gradient -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>

    <!-- Dead-end Red Gradient -->
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ba0000"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sleek Dark Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines for High Tech Aesthetic -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Connective Edges (Traces) -->
  <!-- Decision -> Hypothesis -->
  <path d="M 180 200 C 260 140, 340 140, 420 200" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Hypothesis -> Fact -->
  <path d="M 420 200 C 480 260, 540 260, 600 200" fill="none" stroke="url(#secondaryGrad)" stroke-width="4" filter="url(#glowTeal)"/>
  
  <!-- Decision -> Dead End -->
  <path d="M 180 200 C 300 280, 420 280, 500 230" fill="none" stroke="url(#dangerGrad)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Graph Nodes -->
  
  <!-- Node 1: Decision (Source Node) -->
  <g transform="translate(180,200)">
    <circle r="30" fill="#0c0c1e" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glowViolet)"/>
    <circle r="12" fill="url(#primaryGrad)"/>
  </g>
  
  <!-- Node 2: Hypothesis -->
  <g transform="translate(420,200)">
    <!-- Hexagon representation -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#0c0c1e" stroke="url(#secondaryGrad)" stroke-width="3" filter="url(#glowTeal)"/>
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#secondaryGrad)"/>
  </g>
  
  <!-- Node 3: Fact (Terminal Success) -->
  <g transform="translate(600,200)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#0c0c1e" stroke="url(#secondaryGrad)" stroke-width="3" filter="url(#glowTeal)"/>
    <!-- Checkmark icon -->
    <path d="M -10 0 L -2 8 L 10 -6" fill="none" stroke="url(#secondaryGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Node 4: Dead_End (Terminal Failure) -->
  <g transform="translate(500,230)">
    <circle r="20" fill="#0c0c1e" stroke="url(#dangerGrad)" stroke-width="2" filter="url(#glowRed)"/>
    <!-- X icon -->
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" fill="none" stroke="url(#dangerGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Sleek Typography -->
  <text x="400" y="340" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    W E N C I S
  </text>
  <text x="400" y="365" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#9d4edd" letter-spacing="6" text-anchor="middle">
    EPISTEMIC REASONING ENGINE
  </text>
</svg>
